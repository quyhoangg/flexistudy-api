<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Khôi phục mật khẩu FlexiStudy</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.5; color: #333;">
<h2 style="color: #0b2347;">Khôi phục mật khẩu FlexiStudy 🔑</h2>
<p>Xin chào <b th:text="${userName}">User</b>,</p>

<p>Chúng tôi nhận được yêu cầu đặt lại mật khẩu cho tài khoản của bạn.</p>

<p>Mã OTP của bạn là:</p>
<h1 th:text="${otp}" style="letter-spacing: 4px; color: #0b2347;"></h1>

<p>Mã này có hiệu lực trong <b th:text="${validMinutes}">5</b> phút.</p>

<p>Nếu bạn không yêu cầu, vui lòng bỏ qua email này.</p>
</body>
</html>
